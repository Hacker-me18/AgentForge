[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentos-studio"
version = "0.1.0"
description = "An Open Agent Runtime, Harness & Evaluation Platform"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "agents*", "apps*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["apps/web", "node_modules", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
explicit_package_bases = true
exclude = "(apps/web|node_modules)"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
